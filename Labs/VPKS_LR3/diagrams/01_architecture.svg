<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1110" viewBox="0 0 980 1110"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#497ca5"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="490" y="35" font-family="DejaVu Sans" font-size="27" text-anchor="middle" fill="#193247"><tspan x="490" dy="0">Архитектура Ozon Tracker — 3-Tier</tspan></text><rect x="35" y="75" width="910" height="190" rx="10" fill="#f4f8fc" stroke="#497ca5" stroke-width="2"/><text x="490" y="113" font-family="DejaVu Sans" font-size="25" text-anchor="middle" fill="#193247"><tspan x="490" dy="0">1. Клиентский уровень — браузер</tspan></text><text x="490" y="153" font-family="DejaVu Sans" font-size="21" text-anchor="middle" fill="#193247"><tspan x="490" dy="0">React + TypeScript: товары, профиль, графики, уведомления</tspan></text><text x="490" y="188" font-family="DejaVu Sans" font-size="21" text-anchor="middle" fill="#193247"><tspan x="490" dy="0">Группировка снимков, тема и параметры отображения</tspan></text><text x="490" y="223" font-family="DejaVu Sans" font-size="21" text-anchor="middle" fill="#193247"><tspan x="490" dy="0">В разработке: Vite, localhost:5173</tspan></text><rect x="35" y="390" width="910" height="370" rx="10" fill="#f4f8fc" stroke="#497ca5" stroke-width="2"/><text x="490" y="428" font-family="DejaVu Sans" font-size="25" text-anchor="middle" fill="#193247"><tspan x="490" dy="0">2. Уровень приложения — ASP.NET Core API</tspan></text><text x="490" y="468" font-family="DejaVu Sans" font-size="21" text-anchor="middle" fill="#193247"><tspan x="490" dy="0">Middleware: cookie-аутентификация, авторизация, CORS</tspan></text><text x="490" y="503" font-family="DejaVu Sans" font-size="21" text-anchor="middle" fill="#193247"><tspan x="490" dy="0">Контроллеры: Auth, Products, Profile, Demo, Chat, Export</tspan></text><text x="490" y="538" font-family="DejaVu Sans" font-size="21" text-anchor="middle" fill="#193247"><tspan x="490" dy="0">CurrentAccount: определение владельца данных</tspan></text><text x="490" y="573" font-family="DejaVu Sans" font-size="21" text-anchor="middle" fill="#193247"><tspan x="490" dy="0">Репозитории: SqlAccount / SqlProduct / SqlProfile / SqlNotification</tspan></text><text x="490" y="608" font-family="DejaVu Sans" font-size="21" text-anchor="middle" fill="#193247"><tspan x="490" dy="0">DemoAssistant: ответы по правилам; внешний ИИ не вызывается</tspan></text><text x="490" y="643" font-family="DejaVu Sans" font-size="21" text-anchor="middle" fill="#193247"><tspan x="490" dy="0">Microsoft.Data.SqlClient: SQL, транзакции и параметры</tspan></text><text x="490" y="678" font-family="DejaVu Sans" font-size="21" text-anchor="middle" fill="#193247"><tspan x="490" dy="0">В разработке: localhost:5080</tspan></text><rect x="35" y="880" width="910" height="170" rx="10" fill="#f4f8fc" stroke="#497ca5" stroke-width="2"/><text x="490" y="918" font-family="DejaVu Sans" font-size="25" text-anchor="middle" fill="#193247"><tspan x="490" dy="0">3. Уровень хранения — SQL Server</tspan></text><text x="490" y="958" font-family="DejaVu Sans" font-size="21" text-anchor="middle" fill="#193247"><tspan x="490" dy="0">OzonTrackerDemo: каталог, аккаунты, история, уведомления</tspan></text><text x="490" y="993" font-family="DejaVu Sans" font-size="21" text-anchor="middle" fill="#193247"><tspan x="490" dy="0">PK, FK, UNIQUE, CHECK, индексы; управление через SSMS</tspan></text><text x="490" y="1028" font-family="DejaVu Sans" font-size="21" text-anchor="middle" fill="#193247"><tspan x="490" dy="0">Database/setup.sql; accounts.sql — обновление существующей БД</tspan></text><polyline points="490,265 490,390" fill="none" stroke="#497ca5" stroke-width="2.2" marker-end="url(#a)"/><text x="490" y="327" font-family="DejaVu Sans" font-size="18" text-anchor="middle" fill="#193247"><tspan x="490" dy="0">HTTP / HTTPS · REST · JSON · cookie</tspan></text><polyline points="490,760 490,880" fill="none" stroke="#497ca5" stroke-width="2.2" marker-end="url(#a)"/><text x="490" y="827" font-family="DejaVu Sans" font-size="18" text-anchor="middle" fill="#193247"><tspan x="490" dy="0">TDS / TCP · параметризованный T-SQL</tspan></text><text x="490" y="1090" font-family="DejaVu Sans" font-size="19" text-anchor="middle" fill="#193247"><tspan x="490" dy="0">Браузер не подключается к SQL Server напрямую. Ozon API не используется.</tspan></text></svg>