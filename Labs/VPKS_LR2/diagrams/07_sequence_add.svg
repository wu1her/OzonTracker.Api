<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1230" viewBox="0 0 1200 1230"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#497ca5"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="10" y="35" width="220" height="65" rx="0" fill="#e8f0f6" stroke="#497ca5" stroke-width="2"/><text x="120" y="74" font-family="DejaVu Sans" font-size="21" text-anchor="middle" fill="#193247"><tspan x="120" dy="0">Пользователь</tspan></text><polyline points="120,100 120,1195" fill="none" stroke="#497ca5" stroke-width="2.2" stroke-dasharray="8 6"/><rect x="310" y="35" width="220" height="65" rx="0" fill="#e8f0f6" stroke="#497ca5" stroke-width="2"/><text x="420" y="74" font-family="DejaVu Sans" font-size="21" text-anchor="middle" fill="#193247"><tspan x="420" dy="0">React / интерфейс</tspan></text><polyline points="420,100 420,1195" fill="none" stroke="#497ca5" stroke-width="2.2" stroke-dasharray="8 6"/><rect x="645" y="35" width="220" height="65" rx="0" fill="#e8f0f6" stroke="#497ca5" stroke-width="2"/><text x="755" y="74" font-family="DejaVu Sans" font-size="21" text-anchor="middle" fill="#193247"><tspan x="755" dy="0">ASP.NET Core API</tspan></text><polyline points="755,100 755,1195" fill="none" stroke="#497ca5" stroke-width="2.2" stroke-dasharray="8 6"/><rect x="970" y="35" width="220" height="65" rx="0" fill="#e8f0f6" stroke="#497ca5" stroke-width="2"/><text x="1080" y="74" font-family="DejaVu Sans" font-size="21" text-anchor="middle" fill="#193247"><tspan x="1080" dy="0">SQL Server</tspan></text><polyline points="1080,100 1080,1195" fill="none" stroke="#497ca5" stroke-width="2.2" stroke-dasharray="8 6"/><rect x="412" y="155" width="16" height="1005" rx="0" fill="#c4dfac" stroke="#73a63f" stroke-width="2"/><rect x="747" y="255" width="16" height="790" rx="0" fill="#c4dfac" stroke="#73a63f" stroke-width="2"/><rect x="1072" y="565" width="16" height="95" rx="0" fill="#c4dfac" stroke="#73a63f" stroke-width="2"/><rect x="1072" y="845" width="16" height="95" rx="0" fill="#c4dfac" stroke="#73a63f" stroke-width="2"/><polyline points="120,160 412,160" fill="none" stroke="#497ca5" stroke-width="2.2" marker-end="url(#a)"/><text x="266.0" y="147.0" font-family="DejaVu Sans" font-size="18" text-anchor="middle" fill="#193247"><tspan x="266.0" dy="0">1. Ввести ID / ссылку</tspan></text><polyline points="428,255 747,255" fill="none" stroke="#497ca5" stroke-width="2.2" marker-end="url(#a)"/><text x="587.5" y="242.0" font-family="DejaVu Sans" font-size="18" text-anchor="middle" fill="#193247"><tspan x="587.5" dy="0">2. POST /api/products { value }</tspan></text><text x="755" y="315" font-family="DejaVu Sans" font-size="19" text-anchor="middle" fill="#193247"><tspan x="755" dy="0">3. Определить ID</tspan><tspan x="755" dy="23.75">и текущий AccountId</tspan></text><rect x="18" y="365" width="1164" height="725" rx="0" fill="none" stroke="#778b99" stroke-width="2"/><rect x="18" y="365" width="260" height="30" rx="0" fill="#f3f5f7" stroke="#778b99" stroke-width="2"/><text x="30" y="387" font-family="DejaVu Sans" font-size="18" text-anchor="start" fill="#193247"><tspan x="30" dy="0">alt: результат проверки</tspan></text><polyline points="763,450 412,450" fill="none" stroke="#497ca5" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#a)"/><text x="587.5" y="437.0" font-family="DejaVu Sans" font-size="18" text-anchor="middle" fill="#193247"><tspan x="587.5" dy="0">[ID некорректен] 400</tspan></text><polyline points="18,490 1182,490" fill="none" stroke="#497ca5" stroke-width="2.2" stroke-dasharray="8 6"/><text x="35" y="518" font-family="DejaVu Sans" font-size="18" text-anchor="start" fill="#193247"><tspan x="35" dy="0">[ID корректен]</tspan></text><polyline points="763,565 1072,565" fill="none" stroke="#497ca5" stroke-width="2.2" marker-end="url(#a)"/><text x="917.5" y="552.0" font-family="DejaVu Sans" font-size="18" text-anchor="middle" fill="#193247"><tspan x="917.5" dy="0">4. Каталог + AccountProducts</tspan></text><polyline points="1088,655 747,655" fill="none" stroke="#497ca5" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#a)"/><text x="917.5" y="619.5" font-family="DejaVu Sans" font-size="18" text-anchor="middle" fill="#193247"><tspan x="917.5" dy="0">5. Найден / отсутствует / уже</tspan><tspan x="917.5" dy="22.5">отслеживается</tspan></text><polyline points="763,745 412,745" fill="none" stroke="#497ca5" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#a)"/><text x="587.5" y="732.0" font-family="DejaVu Sans" font-size="18" text-anchor="middle" fill="#193247"><tspan x="587.5" dy="0">[не найден / дубликат] 404 / 409</tspan></text><polyline points="763,845 1072,845" fill="none" stroke="#497ca5" stroke-width="2.2" marker-end="url(#a)"/><text x="917.5" y="809.5" font-family="DejaVu Sans" font-size="18" text-anchor="middle" fill="#193247"><tspan x="917.5" dy="0">[можно добавить] 6. INSERT /</tspan><tspan x="917.5" dy="22.5">UPDATE; снимки; COMMIT</tspan></text><polyline points="1088,935 747,935" fill="none" stroke="#497ca5" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#a)"/><text x="917.5" y="922.0" font-family="DejaVu Sans" font-size="18" text-anchor="middle" fill="#193247"><tspan x="917.5" dy="0">7. Запись сохранена</tspan></text><polyline points="763,1035 412,1035" fill="none" stroke="#497ca5" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#a)"/><text x="587.5" y="1022.0" font-family="DejaVu Sans" font-size="18" text-anchor="middle" fill="#193247"><tspan x="587.5" dy="0">8. 201 Created + товар</tspan></text><polyline points="428,1150 120,1150" fill="none" stroke="#497ca5" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#a)"/><text x="274.0" y="1114.5" font-family="DejaVu Sans" font-size="18" text-anchor="middle" fill="#193247"><tspan x="274.0" dy="0">9. Список обновлён /</tspan><tspan x="274.0" dy="22.5">сообщение об ошибке</tspan></text><text x="600" y="1210" font-family="DejaVu Sans" font-size="17" text-anchor="middle" fill="#193247"><tspan x="600" dy="0">Все API-запросы выполняются в авторизованном сеансе (cookie).</tspan></text></svg>