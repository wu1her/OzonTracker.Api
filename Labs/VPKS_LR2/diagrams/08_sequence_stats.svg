<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1230" viewBox="0 0 1200 1230"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#497ca5"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="10" y="35" width="220" height="65" rx="0" fill="#e8f0f6" stroke="#497ca5" stroke-width="2"/><text x="120" y="74" font-family="DejaVu Sans" font-size="21" text-anchor="middle" fill="#193247"><tspan x="120" dy="0">Пользователь</tspan></text><polyline points="120,100 120,1195" fill="none" stroke="#497ca5" stroke-width="2.2" stroke-dasharray="8 6"/><rect x="310" y="35" width="220" height="65" rx="0" fill="#e8f0f6" stroke="#497ca5" stroke-width="2"/><text x="420" y="74" font-family="DejaVu Sans" font-size="21" text-anchor="middle" fill="#193247"><tspan x="420" dy="0">React / интерфейс</tspan></text><polyline points="420,100 420,1195" fill="none" stroke="#497ca5" stroke-width="2.2" stroke-dasharray="8 6"/><rect x="645" y="35" width="220" height="65" rx="0" fill="#e8f0f6" stroke="#497ca5" stroke-width="2"/><text x="755" y="74" font-family="DejaVu Sans" font-size="21" text-anchor="middle" fill="#193247"><tspan x="755" dy="0">ASP.NET Core API</tspan></text><polyline points="755,100 755,1195" fill="none" stroke="#497ca5" stroke-width="2.2" stroke-dasharray="8 6"/><rect x="970" y="35" width="220" height="65" rx="0" fill="#e8f0f6" stroke="#497ca5" stroke-width="2"/><text x="1080" y="74" font-family="DejaVu Sans" font-size="21" text-anchor="middle" fill="#193247"><tspan x="1080" dy="0">SQL Server</tspan></text><polyline points="1080,100 1080,1195" fill="none" stroke="#497ca5" stroke-width="2.2" stroke-dasharray="8 6"/><rect x="412" y="155" width="16" height="1005" rx="0" fill="#c4dfac" stroke="#73a63f" stroke-width="2"/><rect x="747" y="255" width="16" height="540" rx="0" fill="#c4dfac" stroke="#73a63f" stroke-width="2"/><rect x="1072" y="350" width="16" height="100" rx="0" fill="#c4dfac" stroke="#73a63f" stroke-width="2"/><polyline points="120,160 412,160" fill="none" stroke="#497ca5" stroke-width="2.2" marker-end="url(#a)"/><text x="266.0" y="147.0" font-family="DejaVu Sans" font-size="18" text-anchor="middle" fill="#193247"><tspan x="266.0" dy="0">1. Открыть статистику товара</tspan></text><polyline points="428,255 747,255" fill="none" stroke="#497ca5" stroke-width="2.2" marker-end="url(#a)"/><text x="587.5" y="242.0" font-family="DejaVu Sans" font-size="18" text-anchor="middle" fill="#193247"><tspan x="587.5" dy="0">2. GET /api/products/{id}</tspan></text><polyline points="763,350 1072,350" fill="none" stroke="#497ca5" stroke-width="2.2" marker-end="url(#a)"/><text x="917.5" y="314.5" font-family="DejaVu Sans" font-size="18" text-anchor="middle" fill="#193247"><tspan x="917.5" dy="0">3. SELECT товара и</tspan><tspan x="917.5" dy="22.5">AccountSnapshots по AccountId</tspan></text><polyline points="1088,445 747,445" fill="none" stroke="#497ca5" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#a)"/><text x="917.5" y="432.0" font-family="DejaVu Sans" font-size="18" text-anchor="middle" fill="#193247"><tspan x="917.5" dy="0">4. Товар + личные снимки</tspan></text><rect x="18" y="500" width="1164" height="300" rx="0" fill="none" stroke="#778b99" stroke-width="2"/><rect x="18" y="500" width="260" height="30" rx="0" fill="#f3f5f7" stroke="#778b99" stroke-width="2"/><text x="30" y="522" font-family="DejaVu Sans" font-size="18" text-anchor="start" fill="#193247"><tspan x="30" dy="0">alt: результат запроса</tspan></text><polyline points="763,580 412,580" fill="none" stroke="#497ca5" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#a)"/><text x="587.5" y="544.5" font-family="DejaVu Sans" font-size="18" text-anchor="middle" fill="#193247"><tspan x="587.5" dy="0">[товар доступен] 5. 200 +</tspan><tspan x="587.5" dy="22.5">история</tspan></text><polyline points="18,620 1182,620" fill="none" stroke="#497ca5" stroke-width="2.2" stroke-dasharray="8 6"/><text x="35" y="648" font-family="DejaVu Sans" font-size="18" text-anchor="start" fill="#193247"><tspan x="35" dy="0">[товар не отслеживается / ошибка БД]</tspan></text><polyline points="763,735 412,735" fill="none" stroke="#497ca5" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#a)"/><text x="587.5" y="722.0" font-family="DejaVu Sans" font-size="18" text-anchor="middle" fill="#193247"><tspan x="587.5" dy="0">404 / 503 + сообщение</tspan></text><rect x="18" y="840" width="1164" height="260" rx="0" fill="none" stroke="#778b99" stroke-width="2"/><rect x="18" y="840" width="260" height="30" rx="0" fill="#f3f5f7" stroke="#778b99" stroke-width="2"/><text x="30" y="862" font-family="DejaVu Sans" font-size="18" text-anchor="start" fill="#193247"><tspan x="30" dy="0">loop [данные загружены]</tspan></text><polyline points="120,920 412,920" fill="none" stroke="#497ca5" stroke-width="2.2" marker-end="url(#a)"/><text x="266.0" y="884.5" font-family="DejaVu Sans" font-size="18" text-anchor="middle" fill="#193247"><tspan x="266.0" dy="0">6. Выбрать показатель /</tspan><tspan x="266.0" dy="22.5">период / день–неделю</tspan></text><text x="425" y="980" font-family="DejaVu Sans" font-size="19" text-anchor="middle" fill="#193247"><tspan x="425" dy="0">7. Группировка снимков</tspan><tspan x="425" dy="23.75">и построение графика локально</tspan></text><polyline points="428,1065 120,1065" fill="none" stroke="#497ca5" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#a)"/><text x="274.0" y="1029.5" font-family="DejaVu Sans" font-size="18" text-anchor="middle" fill="#193247"><tspan x="274.0" dy="0">8. График с подсказками / нет</tspan><tspan x="274.0" dy="22.5">данных</tspan></text><text x="600" y="1210" font-family="DejaVu Sans" font-size="17" text-anchor="middle" fill="#193247"><tspan x="600" dy="0">Все API-запросы выполняются в авторизованном сеансе (cookie).</tspan></text></svg>