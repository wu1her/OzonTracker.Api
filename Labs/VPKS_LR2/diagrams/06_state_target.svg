nchor="middle" fill="#193247"><tspan x="150" dy="0">Удалить цель</tspan></text><text x="480" y="1090" font-family="DejaVu Sans" font-size="19" text-anchor="middle" fill="#193247"><tspan x="480" dy="0">После удаления цели модель завершается; новую цель можно задать заново.</tspan></text></svg>