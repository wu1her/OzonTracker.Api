<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1120" viewBox="0 0 960 1120"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#497ca5"/></marker></defs><rect width="100%" height="100%" fill="white"/><circle cx="480" cy="45" r="17" fill="#193247"/><rect x="325.0" y="97.5" width="310" height="85" rx="14" fill="#eff6e8" stroke="#73a63f" stroke-width="2"/><text x="480" y="135" font-family="DejaVu Sans" font-size="21" text-anchor="middle" fill="#193247"><tspan x="480" dy="0">Цель не задана</tspan><tspan x="480" dy="26.25">[TargetPrice IS NULL]</tspan></text><polyline points="480,62 480,97" fill="none" stroke="#497ca5" stroke-width="2.2" marker-end="url(#a)"/><rect x="315.0" y="312.5" width="330" height="85" rx="14" fill="#eff6e8" stroke="#73a63f" stroke-width="2"/><text x="480" y="350" font-family="DejaVu Sans" font-size="21" text-anchor="middle" fill="#193247"><tspan x="480" dy="0">Ожидание достижения</tspan><tspan x="480" dy="26.25">[TargetTriggered = 0]</tspan></text><polyline points="480,182 480,312" fill="none" stroke="#497ca5" stroke-width="2.2" marker-end="url(#a)"/><text x="480" y="240" font-family="DejaVu Sans" font-size="18" text-anchor="middle" fill="#193247"><tspan x="480" dy="0">Задать цель / проверить цену</tspan></text><path d="M480,495 L522,525 L480,555 L438,525 Z" fill="#edf5fb" stroke="#497ca5" stroke-width="2"/><text x="480" y="481" font-family="DejaVu Sans" font-size="19" text-anchor="middle" fill="#193247"><tspan x="480" dy="0">Проверка текущей цены</tspan></text><polyline points="480,397 480,495" fill="none" stroke="#497ca5" stroke-width="2.2" marker-end="url(#a)"/><rect x="295.0" y="692.5" width="370" height="85" rx="14" fill="#eff6e8" stroke="#73a63f" stroke-width="2"/><text x="480" y="730" font-family="DejaVu Sans" font-size="21" text-anchor="middle" fill="#193247"><tspan x="480" dy="0">Срабатывание зафиксировано</tspan><tspan x="480" dy="26.25">[TargetTriggered