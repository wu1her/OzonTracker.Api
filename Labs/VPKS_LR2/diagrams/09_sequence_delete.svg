<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1230" viewBox="0 0 1200 1230"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#497ca5"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="10" y="35" width="220" height="65" rx="0" fill="#e8f0f6" stroke="#497ca5" stroke-width="2"/><text x="120" y="74" font-family="DejaVu Sans" font-size="21" text-anchor="middle" fill="#193247"><tspan x="120" dy="0">Пользователь</tspan></text><polyline points="120,100 120,1195" fill="none" stroke="#497ca5" stroke-width="2.2" stroke-dasharray="8 6"/><rect x="310" y="35" width="220" height="65" rx="0" fill="#e8f0f6" stroke="#497ca5" stroke-width="2"/><text x="420" y="74" font-family="DejaVu Sans" font-size="21" text-anchor="middle" fill="#193247"><tspan x="420" dy="0">React / интерфейс</tspan></text><polyline points="420,100 420,1195" fill="none" stroke="#497ca5" stroke-width="2.2" stroke-dasharray="8 6"/><rect x="645" y="35" width="220" height="65" rx="0" fill="#e8f0f6" stroke="#497ca5" stroke-width="2"/><text x="755" y="74" font-family="DejaVu Sans" font-size="21" text-anchor="middle" fill="#193247"><tspan x="755" dy="0">ASP.NET Core API</tspan></text><polyline points="755,100 755,1195" fill="none" stroke="#497ca5" stroke-width="2.2" stroke-dasharray="8 6"/><rect x="970" y="35" width="220" height="65" rx="0" fill="#e8f0f6" stroke="#497ca5" stroke-width="2"/><text x="1080" y="74" font-family="DejaVu Sans" font-size="21" text-anchor="middle" fill="#193247"><tspan x="1080" dy="0">SQL Server</tspan></text><polyline points="1080,100 1080,1195" fill="none" stroke="#497ca5" stroke-width="2.2" stroke-dasharray="8 6"/><rect x="412" y="155" width="16" height="1005" rx="0" fill="#c4dfac" stroke="#73a63f" stroke-width="2"/><rect x="747" y="610" width="16" height="325" rx="0" fill="#c4dfac" stroke="#73a63f" stroke-width="2"/><rect x="1072" y="710" width="16" height="110" rx="0" fill="#c4dfac" stroke="#73a63f" stroke-width="2"/><polyline points="120,160 412,160" fill="none" stroke="#497ca5" stroke-width="2.2" marker-end="url(#a)"/><text x="266.0" y="147.0" font-family="DejaVu Sans" font-size="18" text-anchor="middle" fill="#193247"><tspan x="266.0" dy="0">1. Нажать «Удалить»</tspan></text><polyline points="428,250 120,250" fill="none" stroke="#497ca5" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#a)"/><text x="274.0" y="237.0" font-family="DejaVu Sans" font-size="18" text-anchor="middle" fill="#193247"><tspan x="274.0" dy="0">2. Запрос подтверждения</tspan></text><rect x="18" y="310" width="1164" height="790" rx="0" fill="none" stroke="#778b99" stroke-width="2"/><rect x="18" y="310" width="260" height="30" rx="0" fill="#f3f5f7" stroke="#778b99" stroke-width="2"/><text x="30" y="332" font-family="DejaVu Sans" font-size="18" text-anchor="start" fill="#193247"><tspan x="30" dy="0">alt: решение пользователя</tspan></text><polyline points="120,390 412,390" fill="none" stroke="#497ca5" stroke-width="2.2" marker-end="url(#a)"/><text x="266.0" y="354.5" font-family="DejaVu Sans" font-size="18" text-anchor="middle" fill="#193247"><tspan x="266.0" dy="0">[отмена] закрыть</tspan><tspan x="266.0" dy="22.5">подтверждение</tspan></text><polyline points="18,435 1182,435" fill="none" stroke="#497ca5" stroke-width="2.2" stroke-dasharray="8 6"/><text x="35" y="463" font-family="DejaVu Sans" font-size="18" text-anchor="start" fill="#193247"><tspan x="35" dy="0">[удаление подтверждено]</tspan></text><polyline points="120,520 412,520" fill="none" stroke="#497ca5" stroke-width="2.2" marker-end="url(#a)"/><text x="266.0" y="507.0" font-family="DejaVu Sans" font-size="18" text-anchor="middle" fill="#193247"><tspan x="266.0" dy="0">3. Подтвердить</tspan></text><polyline points="428,610 747,610" fill="none" stroke="#497ca5" stroke-width="2.2" marker-end="url(#a)"/><text x="587.5" y="597.0" font-family="DejaVu Sans" font-size="18" text-anchor="middle" fill="#193247"><tspan x="587.5" dy="0">4. DELETE /api/products/{id}</tspan></text><polyline points="763,710 1072,710" fill="none" stroke="#497ca5" stroke-width="2.2" marker-end="url(#a)"/><text x="917.5" y="674.5" font-family="DejaVu Sans" font-size="18" text-anchor="middle" fill="#193247"><tspan x="917.5" dy="0">5. UPDATE AccountProducts SET</tspan><tspan x="917.5" dy="22.5">IsTracked=0</tspan></text><polyline points="1088,815 747,815" fill="none" stroke="#497ca5" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#a)"/><text x="917.5" y="779.5" font-family="DejaVu Sans" font-size="18" text-anchor="middle" fill="#193247"><tspan x="917.5" dy="0">6. Количество изменённых</tspan><tspan x="917.5" dy="22.5">записей</tspan></text><polyline points="763,920 412,920" fill="none" stroke="#497ca5" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#a)"/><text x="587.5" y="884.5" font-family="DejaVu Sans" font-size="18" text-anchor="middle" fill="#193247"><tspan x="587.5" dy="0">7. 204 / 404 (история остаётся в</tspan><tspan x="587.5" dy="22.5">БД)</tspan></text><polyline points="428,1030 120,1030" fill="none" stroke="#497ca5" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#a)"/><text x="274.0" y="994.5" font-family="DejaVu Sans" font-size="18" text-anchor="middle" fill="#193247"><tspan x="274.0" dy="0">8. Обновить список / показать</tspan><tspan x="274.0" dy="22.5">сообщение</tspan></text><text x="600" y="1210" font-family="DejaVu Sans" font-size="17" text-anchor="middle" fill="#193247"><tspan x="600" dy="0">Все API-запросы выполняются в авторизованном сеансе (cookie).</tspan></text></svg>